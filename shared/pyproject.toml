[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opamp-shared"
version = "0.6.0"
description = "Shared runtime utilities for OpAMP components"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Phil Wilkins" }]
keywords = ["opamp", "observability", "shared", "configuration", "security"]
dependencies = [
  "quart>=0.19",
]

[project.optional-dependencies]
dev = [
  "pylint>=3.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.0",
]

[project.urls]
Repository = "https://github.com/opamp-observe/opamp-core"
Homepage = "https://htmlpreview.github.io/?https://raw.githubusercontent.com/opamp-observe/opamp-core/main/github-landingpage/index.html"
Blog = "https://blog.mp3monster.org/category/technology/fluent-observability/opamp/"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["shared"]

[tool.pytest.ini_options]
addopts = [
  "-s",
  "--cov=shared",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-branch",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["shared"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
  "global-statement", # OpenTelemetry providers are process-wide singletons.
  "import-outside-toplevel", # Observability dependencies are optional until enabled.
  "invalid-name", # Protocol enum member names preserve the public OpAMP contract.
  "too-many-locals", # Observability setup coordinates the related provider objects.
  "too-many-return-statements", # Config coercion exits early for each supported shape.
]
