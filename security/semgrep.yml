rules:
  - id: opamp-python-subprocess-shell-true
    message: >-
      A subprocess uses shell=True. Keep every argument trusted and document why a shell is
      required, or pass an argument list without a shell.
    languages:
      - python
    severity: WARNING
    patterns:
      - pattern: subprocess.$FUNCTION(..., shell=True, ...)
      - metavariable-regex:
          metavariable: $FUNCTION
          regex: ^(call|check_call|check_output|Popen|run)$

  - id: opamp-python-disabled-tls-verification
    message: >-
      TLS certificate verification is disabled. Restrict this behavior to an explicit test
      boundary or configure a trusted CA bundle.
    languages:
      - python
    severity: ERROR
    pattern-either:
      - pattern: requests.$FUNCTION(..., verify=False, ...)
      - pattern: httpx.$FUNCTION(..., verify=False, ...)

  - id: opamp-python-unsafe-yaml-loader
    message: Use yaml.safe_load or a project loader derived from SafeLoader for untrusted YAML.
    languages:
      - python
    severity: ERROR
    pattern-either:
      - pattern: yaml.load(..., Loader=yaml.Loader, ...)
      - pattern: yaml.load(..., Loader=yaml.UnsafeLoader, ...)

  - id: opamp-javascript-dynamic-code-execution
    message: Avoid dynamic JavaScript execution because input can become executable code.
    languages:
      - javascript
      - typescript
    severity: ERROR
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
