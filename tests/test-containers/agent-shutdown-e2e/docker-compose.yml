name: opamp-agent-shutdown-e2e

services:
  provider:
    build:
      context: ../../..
      dockerfile: tests/test-containers/agent-shutdown-e2e/Dockerfile
    image: opamp-agent-shutdown-e2e-runtime:latest
    command: ["/usr/local/bin/agent-shutdown-provider-entrypoint"]
    environment:
      APP_ENABLE_DEV_FEATURES: "true"
    ports:
      - "${AGENT_SHUTDOWN_PROVIDER_PORT:-18190}:8080"
    volumes:
      - ../../..:/workspace/source:ro
      - ./config/provider:/config:ro
      - ../../../dist/test-reports/agent-shutdown-e2e/provider:/evidence
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/clients"]
      interval: 3s
      timeout: 2s
      retries: 40
    networks:
      - shutdown-e2e

networks:
  shutdown-e2e:
    name: opamp-agent-shutdown-e2e-network
