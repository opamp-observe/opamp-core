name: Publish release distributions to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish the validated wheels after the build completes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_tests:
    name: Verify successful GitHub test run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful tests for the release commit
        shell: bash
        env:
          EXPECTED_CONCLUSION: success
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRED_BRANCH: main
          REQUIRED_WORKFLOW_FILE: main_fluent-opamp.yml
        run: |
          set -euo pipefail
          workflow_runs_file="$(mktemp)"
          trap 'rm -f "$workflow_runs_file"' EXIT
          curl --fail --silent --show-error --get \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "branch=$REQUIRED_BRANCH" \
            --data-urlencode "head_sha=$EXPECTED_SHA" \
            --data-urlencode "status=completed" \
            --data-urlencode "per_page=100" \
            --output "$workflow_runs_file" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$REQUIRED_WORKFLOW_FILE/runs"
          successful_run_url="$(
            jq --arg expected_conclusion "$EXPECTED_CONCLUSION" --raw-output \
              '[.workflow_runs[] | select(.conclusion == $expected_conclusion)][0].html_url // empty' \
              "$workflow_runs_file"
          )"
          if [[ -z "$successful_run_url" ]]; then
            echo "No successful $REQUIRED_WORKFLOW_FILE run exists for $EXPECTED_SHA on $REQUIRED_BRANCH." >&2
            exit 1
          fi
          echo "Verified successful test run: $successful_run_url" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and validate release distributions
    needs:
      - verify_tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install repository development environment
        shell: bash
        run: |
          set -euo pipefail
          python cli/main.py setup-venv

      - name: Run security gate and build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/opamp-dev-cli build release-assets --skip-manual

      - name: Validate the PyPI wheel set
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/opamp-dev-cli dev publish-pypi --index pypi --dry-run

      - name: Stage immutable wheel artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pypi-dist
          find dist -type f -name '*.whl' -print0 \
            | xargs -0 -r -I '{}' cp '{}' pypi-dist/
          wheel_count="$(find pypi-dist -maxdepth 1 -type f -name '*.whl' | wc -l)"
          if [[ "$wheel_count" -ne 10 ]]; then
            echo "Expected 10 release wheels, found $wheel_count." >&2
            exit 1
          fi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: pypi-dist/*.whl
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish distributions to PyPI
    needs:
      - build
    if: >-
      github.event_name == 'release' ||
      (inputs.publish_to_pypi && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Publish with PyPI Trusted Publishing
        shell: bash
        run: >-
          uv publish
          --publish-url https://upload.pypi.org/legacy/
          --check-url https://pypi.org/simple/
          --trusted-publishing always
          dist/*.whl
