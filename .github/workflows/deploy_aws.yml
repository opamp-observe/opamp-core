name: Deploy AWS OpAMP regression environment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Create/update or destroy the CloudFormation stack
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
      aws_region:
        description: AWS region
        required: true
        default: eu-west-2
        type: string
      stack_name:
        description: CloudFormation stack name
        required: true
        default: opamp-regression
        type: string
      artifact_bucket:
        description: Existing retained S3 bucket; leave blank to create a timestamped bucket
        required: false
        type: string
      artifact_key:
        description: S3 object key for the generated artifact archive
        required: true
        default: opamp-cloud/opamp-cloud-artifacts.tar.gz
        type: string
      key_name:
        description: Existing EC2 key pair name (required for deploy)
        required: false
        type: string
      admin_source_cidr:
        description: IPv4 CIDR allowed to SSH, normally your address with /32
        required: false
        type: string
      instance_type:
        description: EC2 instance type
        required: true
        default: t3.small
        type: choice
        options:
          - t3.small
          - t3.medium
          - t3.large
      name_prefix:
        description: Prefix for AWS resource names and tags
        required: true
        default: opamp
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-opamp-${{ inputs.stack_name }}-${{ inputs.aws_region }}
  cancel-in-progress: false

jobs:
  deploy-or-destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      STACK_NAME: ${{ inputs.stack_name }}

    steps:
      - name: Check out repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_auth_header="$(
            printf 'x-access-token:%s' "$GITHUB_TOKEN" \
              | python3 -c 'import base64, sys; print(base64.b64encode(sys.stdin.buffer.read()).decode())'
          )"
          git init --initial-branch=main "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic $checkout_auth_header" \
            fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

      - name: Configure AWS credentials through OIDC
        shell: bash
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          [[ -n "$AWS_ROLE_TO_ASSUME" ]] || { echo "AWS_ROLE_TO_ASSUME secret is required" >&2; exit 1; }
          aws_oidc_token="$(
            curl -fsS \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])'
          )"
          read -r aws_access_key_id aws_secret_access_key aws_session_token < <(
            aws sts assume-role-with-web-identity \
              --role-arn "$AWS_ROLE_TO_ASSUME" \
              --role-session-name "opamp-$GITHUB_RUN_ID" \
              --web-identity-token "$aws_oidc_token" \
              --duration-seconds 3600 \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
              --output text
          )
          {
            echo "AWS_ACCESS_KEY_ID=$aws_access_key_id"
            echo "AWS_SECRET_ACCESS_KEY=$aws_secret_access_key"
            echo "AWS_SESSION_TOKEN=$aws_session_token"
            echo "AWS_DEFAULT_REGION=$AWS_REGION"
          } >> "$GITHUB_ENV"

      - name: Validate deployment inputs
        if: inputs.action == 'deploy'
        shell: bash
        env:
          INPUT_ADMIN_SOURCE_CIDR: ${{ inputs.admin_source_cidr }}
          INPUT_KEY_NAME: ${{ inputs.key_name }}
        run: |
          set -euo pipefail
          [[ -n "$INPUT_KEY_NAME" ]] || { echo "key_name is required" >&2; exit 1; }
          [[ -n "$INPUT_ADMIN_SOURCE_CIDR" ]] || { echo "admin_source_cidr is required" >&2; exit 1; }

      - name: Create workflow parameter file
        if: inputs.action == 'deploy'
        shell: bash
        env:
          INPUT_ADMIN_SOURCE_CIDR: ${{ inputs.admin_source_cidr }}
          INPUT_INSTANCE_TYPE: ${{ inputs.instance_type }}
          INPUT_KEY_NAME: ${{ inputs.key_name }}
          INPUT_NAME_PREFIX: ${{ inputs.name_prefix }}
        run: |
          printf '%s\n' \
            "NamePrefix=$INPUT_NAME_PREFIX" \
            "KeyName=$INPUT_KEY_NAME" \
            "AdminSourceCidr=$INPUT_ADMIN_SOURCE_CIDR" \
            "InstanceType=$INPUT_INSTANCE_TYPE" \
            "VpcCidr=10.42.0.0/16" \
            "PublicSubnetCidr=10.42.0.0/24" \
            "ServerPrivateIp=10.42.0.10" \
            "ConsumerPrivateIp=10.42.0.20" \
            "KeycloakAdminUser=admin" \
            > cloud/aws/parameters.workflow.env

      - name: Package and deploy AWS stack
        if: inputs.action == 'deploy'
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ inputs.artifact_bucket }}
          ARTIFACT_KEY: ${{ inputs.artifact_key }}
          PARAMETERS_FILE: cloud/aws/parameters.workflow.env
          CLOUDFORMATION_ROLE_ARN: ${{ secrets.AWS_CLOUDFORMATION_ROLE_ARN }}
        run: bash cloud/aws/deploy.sh

      - name: Summarize retained AWS storage
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          retained_bucket="$(cat dist/aws-artifact-bucket.txt)"
          connection_guide="$(find dist/aws-regression-results -name connection_details.md -type f | sort | tail -n 1)"
          {
            cat "$connection_guide"
            echo ""
            echo "## Retained AWS storage"
            echo ""
            echo "Bucket: \`$retained_bucket\`"
            echo ""
            echo "This bucket is not deleted when the CloudFormation stack is destroyed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy AWS stack
        if: inputs.action == 'destroy'
        shell: bash
        env:
          WAIT_FOR_DELETE: "true"
        run: bash cloud/aws/destroy.sh
