name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_auth_header="$(
            printf 'x-access-token:%s' "$GITHUB_TOKEN" \
              | python3 -c 'import base64, sys; print(base64.b64encode(sys.stdin.buffer.read()).decode())'
          )"
          git init --initial-branch=main "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic $checkout_auth_header" \
            fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

      - name: Install documentation dependencies
        working-directory: docs
        shell: bash
        run: |
          set -euo pipefail
          gem install bundler --version 4.0.22 --no-document
          bundle config set path ../vendor/bundle
          bundle install

      - name: Build documentation
        working-directory: docs
        shell: bash
        run: bundle exec jekyll build --destination ../_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
