# SCM_source_name: docs/full-demo/active
# SCM_config_version: full-demo-active
# service_instance_id: full-demo-fluentd

<system>
  log_level info
  rpc_endpoint 127.0.0.1:24444
</system>

<source>
  @type monitor_agent
  bind 127.0.0.1
  port 24220
</source>

<source>
  @type dummy
  tag full.demo.fluentd
  dummy {"agent":"fluentd","profile":"full-demo","variant":"active"}
</source>

<match **>
  @type file
  path docs/full-demo/out/fluentd/active
  append true
</match>
