# config-service: config_type=Elastic Agent
# agent_description: Full demo Elastic Agent active configuration
# config_version: 2026.09.10-active
# configuration_date: 2026-09-10
# SCM_source_name: docs/full-demo/active
# SCM_config_version: full-demo-active
# service_instance_id: full-demo-elastic-agent

outputs:
  default:
    type: logstash
    hosts: ["${OPAMP_LOGSTASH_HOST:127.0.0.1}:5044"]

management:
  mode: local

inputs: []

agent.monitoring:
  enabled: true
  logs: true
  metrics: true
  metrics_period: 10s
  use_output: default
  http:
    enabled: true
    host: 127.0.0.1
    port: 6791

agent.logging.level: info
agent.logging.to_stderr: true
agent.logging.to_files: true
agent.logging.files:
  path: "${OPAMP_FULL_DEMO_OUT:docs/full-demo/out}/elastic-agent-logs"
  name: elastic-agent
  rotateeverybytes: 10485760
  keepfiles: 5
agent.logging.json: true
