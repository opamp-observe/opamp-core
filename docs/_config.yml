title: OpAMP
author: mp3monster.org
copyright: "Copyright (c) 2026-{currentYear} {author}"
description: >-
  Documentation for the Fluent OpAMP provider, consumers, configuration
  services, and related Open Agent Management Protocol integrations.
url: "https://opamp.info"
baseurl: ""
repository: opamp-observe/opamp-core
lang: en
favicon: "https://raw.githubusercontent.com/opamp-observe/opamp-core/main/config-service/src/config_service/html/opamp_logo.png"

remote_theme: jeffreytse/jekyll-theme-yat@v1.10.0

plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

mermaid:
  enabled: true
  version: "10.9.1"

theme_color: snowwhite
brand_color: "#1844af"
night_mode: auto
header_transparent: false
content_width: 1120px

yat:
  date_format: "%b %d, %Y"

header_pages:
  - index.md
  - features.md
  - consumer_implementations.md
  - roadmap/index.md

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: framework
