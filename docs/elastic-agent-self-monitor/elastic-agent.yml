outputs:
  default:
    type: logstash
    hosts: ["${env.OPAMP_LOGSTASH_HOST|'127.0.0.1'}:5044"]

management:
  mode: local

inputs: []

agent.monitoring:
  enabled: true
  logs: true
  metrics: true
  metrics_period: 10s
  use_output: default
  http:
    enabled: true
    host: localhost
    port: 6791

agent.logging.level: info
agent.logging.to_stderr: false
agent.logging.to_files: true
agent.logging.files:
  path: "${env.OPAMP_ELASTIC_AGENT_LOG_DIR|'./elastic-agent-logs'}"
  name: elastic-agent
  rotateeverybytes: 10485760
  keepfiles: 5
agent.logging.json: true
